[project]
name = "anki-automator"
version = "0.1.0"
description = "CLI that turns a numbered English word list into Anki cards via Claude + gTTS + AnkiConnect"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "groq>=0.11.0",
    "gtts>=2.5.0",
    "requests>=2.32.0",
    "questionary>=2.0.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
anki-automator = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
